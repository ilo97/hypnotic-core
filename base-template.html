<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__PAGE_TITLE__</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-color: #030303;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --subtext-color: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-color);
        }

        body {
            min-height: 320vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px;
            pointer-events: none;
            opacity: 0;
            will-change: opacity, transform;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            pointer-events: auto;
        }

        .logo {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        header:hover nav ul {
            opacity: 1;
            transform: translateY(0);
        }

        nav a {
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .main-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            will-change: transform, opacity;
        }

        .main-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.05em;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .main-title p {
            font-size: 12px;
            font-weight: 200;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--subtext-color);
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .footer-text {
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
        }

        .scroll-hint {
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 15px;
            will-change: transform, opacity;
        }

        .scroll-line {
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, var(--accent-color), transparent);
            transform-origin: top;
        }

        .scroll-space {
            position: relative;
            z-index: 0;
            height: 320vh;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <div class="logo">__BRAND_NAME__</div>
            <nav>
                <ul>
                    <li><a href="#">Works</a></li>
                    <li><a href="#">Process</a></li>
                    <li><a href="#">Connect</a></li>
                </ul>
            </nav>
        </header>

        <div class="main-title">
            <h1>__MAIN_TITLE__</h1>
            <p>__SUB_TITLE__</p>
        </div>

        <footer>
            <div class="footer-text">Built with Passion & Code</div>
            <div class="scroll-hint">
                <span>Explore</span>
                <div class="scroll-line"></div>
            </div>
        </footer>
    </div>

    <canvas id="webgl"></canvas>
    <div class="scroll-space" aria-hidden="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        const CONFIG = __CONFIG_JSON__;

        document.documentElement.style.setProperty('--bg-color', CONFIG.colors.background);
        document.documentElement.style.setProperty('--accent-color', CONFIG.colors.base);

        const scrollSpace = document.querySelector('.scroll-space');
        const scrollHeight = Math.max(200, Number(CONFIG.scroll.heightVh || 320));
        document.body.style.minHeight = scrollHeight + 'vh';
        scrollSpace.style.height = scrollHeight + 'vh';

        gsap.registerPlugin(ScrollTrigger);

        const scene = new THREE.Scene();
        const canvas = document.querySelector('#webgl');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 4;

        const count = Number(CONFIG.particles.count || 25000);
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const originalPositions = new Float32Array(count * 3);
        const scatteredPositions = new Float32Array(count * 3);

        const sphereRadius = Number(CONFIG.particles.sphereRadius || 1.3);
        const scatterSpread = Number(CONFIG.particles.scatterSpread || 10);

        for (let i = 0; i < count * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);

            const x = sphereRadius * Math.sin(phi) * Math.cos(theta);
            const y = sphereRadius * Math.sin(phi) * Math.sin(theta);
            const z = sphereRadius * Math.cos(phi);

            originalPositions[i] = x;
            originalPositions[i + 1] = y;
            originalPositions[i + 2] = z;

            scatteredPositions[i] = (Math.random() - 0.5) * scatterSpread;
            scatteredPositions[i + 1] = (Math.random() - 0.5) * scatterSpread;
            scatteredPositions[i + 2] = (Math.random() - 0.5) * scatterSpread;

            positions[i] = scatteredPositions[i];
            positions[i + 1] = scatteredPositions[i + 1];
            positions[i + 2] = scatteredPositions[i + 2];
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleIntroDuration = Number(CONFIG.intro.duration || 2.5);
        const particleIntroDelay = Number(CONFIG.intro.delay || 0.2);

        const intro = { progress: 0 };
        gsap.to(intro, {
            progress: 1,
            duration: particleIntroDuration,
            ease: CONFIG.intro.ease || 'power2.inOut',
            delay: particleIntroDelay
        });

        const material = new THREE.PointsMaterial({
            size: Number(CONFIG.particles.size || 0.012),
            color: CONFIG.colors.base,
            transparent: true,
            opacity: Number(CONFIG.particles.opacity || 0.8),
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        const mouse = { x: 0, y: 0 };
        const setMouseX = gsap.quickTo(mouse, 'x', {
            duration: Number(CONFIG.mouse.quickToDuration || 0.8),
            ease: CONFIG.mouse.quickToEase || 'power3.out'
        });
        const setMouseY = gsap.quickTo(mouse, 'y', {
            duration: Number(CONFIG.mouse.quickToDuration || 0.8),
            ease: CONFIG.mouse.quickToEase || 'power3.out'
        });

        let mouseSpeed = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;

        window.addEventListener('mousemove', (event) => {
            const targetX = (event.clientX / window.innerWidth) * 2 - 1;
            const targetY = -(event.clientY / window.innerHeight) * 2 + 1;
            setMouseX(targetX);
            setMouseY(targetY);
        });

        const scrollState = { progress: 0 };
        gsap.to(scrollState, {
            progress: 1,
            ease: 'none',
            scrollTrigger: {
                trigger: '.scroll-space',
                start: 'top top',
                end: 'bottom bottom',
                scrub: Number(CONFIG.scroll.scrub || 1.2)
            }
        });

        gsap.to('.main-title', {
            opacity: 0,
            yPercent: -30,
            ease: 'none',
            scrollTrigger: {
                trigger: '.scroll-space',
                start: 'top top',
                end: `${Number(CONFIG.scroll.titleFadeEnd || 45)}% top`,
                scrub: true
            }
        });

        gsap.to('.scroll-hint', {
            opacity: 0,
            y: 20,
            ease: 'none',
            scrollTrigger: {
                trigger: '.scroll-space',
                start: 'top top',
                end: `${Number(CONFIG.scroll.hintFadeEnd || 30)}% top`,
                scrub: true
            }
        });

        gsap.to('.scroll-line', {
            scaleY: 0.15,
            transformOrigin: 'top',
            repeat: -1,
            yoyo: true,
            duration: 0.9,
            ease: 'sine.inOut'
        });

        const overlayIntroDelay = particleIntroDelay + particleIntroDuration + Number(CONFIG.intro.overlayOffset || 0.3);
        const introTl = gsap.timeline({
            delay: overlayIntroDelay,
            defaults: { ease: 'power3.out' }
        });

        introTl
            .to('.overlay', { opacity: 1, duration: 1.2 }, 0)
            .from('.main-title h1', { y: 36, opacity: 0, duration: 1 }, 0.15)
            .from('.main-title p', { y: 20, opacity: 0, duration: 0.9 }, 0.35)
            .from('.logo', { y: -16, opacity: 0, duration: 0.8 }, 0.25)
            .from('.footer-text, .scroll-hint', { y: 18, opacity: 0, duration: 0.8, stagger: 0.08 }, 0.45);

        const clock = new THREE.Clock();
        const baseColor = new THREE.Color(CONFIG.colors.base);
        const targetColor = new THREE.Color(CONFIG.colors.accent);

        const waveAmplitude = Number(CONFIG.particles.waveAmplitude || 0.12);
        const waveFrequency = Number(CONFIG.particles.waveFrequency || 2);
        const mouseInfluence = Number(CONFIG.particles.mouseInfluence || 0.15);
        const colorMorphStrength = Number(CONFIG.particles.colorMorphStrength || 8);
        const cameraInfluence = Number(CONFIG.mouse.cameraInfluence || 0.35);

        const camEnd = CONFIG.scroll.cameraEnd || { x: 0.95, y: 0.7, z: 2.55 };
        const rot = CONFIG.scroll.rotation || { y: 0.95, x: 0.22 };

        const tick = () => {
            const elapsedTime = clock.getElapsedTime();

            const dx = mouse.x - lastMouseX;
            const dy = mouse.y - lastMouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            mouseSpeed += (dist - mouseSpeed) * 0.1;
            lastMouseX = mouse.x;
            lastMouseY = mouse.y;

            material.color.copy(baseColor).lerp(targetColor, Math.min(mouseSpeed * colorMorphStrength, 1));

            const scrollP = scrollState.progress;
            particleSystem.rotation.y = elapsedTime * 0.05 + scrollP * Number(rot.y || 0.95);
            particleSystem.rotation.x = elapsedTime * 0.02 + scrollP * Number(rot.x || 0.22);

            const positionAttribute = geometry.attributes.position;
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;

                const sx = scatteredPositions[i3];
                const sy = scatteredPositions[i3 + 1];
                const sz = scatteredPositions[i3 + 2];

                const tx = originalPositions[i3];
                const ty = originalPositions[i3 + 1];
                const tz = originalPositions[i3 + 2];

                const cx = sx + (tx - sx) * intro.progress;
                const cy = sy + (ty - sy) * intro.progress;
                const cz = sz + (tz - sz) * intro.progress;

                const wave = Math.sin(tx * waveFrequency + elapsedTime) * waveAmplitude * Math.cos(ty * waveFrequency + elapsedTime) * intro.progress;

                positionAttribute.array[i3] = cx + tx * wave + mouse.x * mouseInfluence * intro.progress;
                positionAttribute.array[i3 + 1] = cy + ty * wave + mouse.y * mouseInfluence * intro.progress;
                positionAttribute.array[i3 + 2] = cz + tz * wave;
            }

            positionAttribute.needsUpdate = true;

            const cameraTargetX = THREE.MathUtils.lerp(0, Number(camEnd.x || 0.95), scrollP) + mouse.x * cameraInfluence;
            const cameraTargetY = THREE.MathUtils.lerp(0, Number(camEnd.y || 0.7), scrollP) + mouse.y * cameraInfluence;
            const cameraTargetZ = THREE.MathUtils.lerp(4, Number(camEnd.z || 2.55), scrollP);

            camera.position.x += (cameraTargetX - camera.position.x) * 0.05;
            camera.position.y += (cameraTargetY - camera.position.y) * 0.05;
            camera.position.z += (cameraTargetZ - camera.position.z) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
            window.requestAnimationFrame(tick);
        };

        tick();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            ScrollTrigger.refresh();
        });
    </script>
</body>
</html>
