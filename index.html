<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Studio</title>
<meta name="description" content="Aesthetic Studio – scroll-triggered 3D web experiences that turn visitors into buyers. Prompt-to-3D landing pages, hypnotic motion, sound design.">
<meta property="og:title" content="Aesthetic Studio">
<meta property="og:description" content="Scroll-triggered 3D web experiences that turn visitors into buyers.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ilo97.github.io/hypnotic-core/">
<meta property="og:image" content="https://ilo97.github.io/hypnotic-core/assets/example1.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Aesthetic Studio">
<meta name="twitter:description" content="Scroll-triggered 3D web experiences that turn visitors into buyers.">
<meta name="twitter:image" content="https://ilo97.github.io/hypnotic-core/assets/example1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#f0e6ff;font-family:'Inter',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;cursor:crosshair}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.overlay{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px;text-align:center;pointer-events:none}
.overlay>*{pointer-events:auto}
.badge{font-size:8px;letter-spacing:.5em;text-transform:uppercase;color:rgba(184,169,255,0.2);margin-bottom:15px;opacity:0}
h1{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(36px,6vw,72px);font-weight:400;background:linear-gradient(180deg,#f0e6ff 0%,rgba(184,169,255,0.3) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;opacity:0;transform:translateY(30px)}
h1 em{background:linear-gradient(135deg,#ff6b9d,#d4a0ff,#7dd3fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:clamp(13px,1.5vw,18px);font-weight:200;color:rgba(240,230,255,0.15);margin-bottom:30px;opacity:0;transform:translateY(15px);letter-spacing:.05em}
.cta{padding:14px 40px;border:1px solid #b8a9ff;color:#b8a9ff;font-size:9px;letter-spacing:.3em;text-transform:uppercase;background:transparent;cursor:pointer;transition:all .5s;text-decoration:none;opacity:0;font-family:'Inter',sans-serif}
.cta:hover{background:#b8a9ff;color:#050510}
.scroll-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:7px;letter-spacing:.4em;text-transform:uppercase;color:rgba(184,169,255,0.1);opacity:0}
.gld-line{width:1px;height:30px;background:linear-gradient(to bottom,#b8a9ff,transparent);margin:6px auto 0;animation:br 3s infinite}
@keyframes br{0%{opacity:.2;transform:scaleY(.3);transform-origin:top}50%{opacity:1;transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{opacity:.2;transform:scaleY(.3);transform-origin:bottom}}
footer{padding:15px 40px;display:flex;justify-content:space-between;font-size:7px;letter-spacing:.25em;text-transform:uppercase;color:rgba(240,230,255,0.03);border-top:1px solid rgba(184,169,255,0.01);position:relative;z-index:1}
@media(max-width:768px){h1{font-size:clamp(24px,8vw,36px)}.overlay{padding:30px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="badge" id="badge">✦ Aesthetic Studio ✦</div>
  <h1 id="h1">Ready to build<br><em>something unforgettable?</em></h1>
  <div class="sub" id="sub">One prompt. One scroll-triggered 3D ad your audience won't scroll past.</div>
  <a class="cta" id="ctaBtn" href="mailto:hi@aesthetic.studio">✦ Let's Begin</a>
  <a class="cta" id="ctaBtn2" href="platform-index.html" style="margin-top:10px;opacity:0">✦ Explore the Platform</a>
  <div class="scroll-hint" id="sHint"><span>Scroll</span><div class="gld-line"></div></div>
</div>
<footer><span>© 2026 Aesthetic Studio</span><a href="platform-index.html" style="color:rgba(184,169,255,0.4);text-decoration:none;letter-spacing:.25em;font-size:7px;text-transform:uppercase">Enter the Platform →</a><span>✦ Aesthetic Studio ✦</span></footer>

<script>
gsap.registerPlugin(ScrollTrigger);

const c=document.getElementById('c'),r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});
r.setSize(window.innerWidth,window.innerHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));
r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.15;
const S=new THREE.Scene(),M=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
M.position.z=40;
const PERF=window.innerWidth<480?0.7:1;

// Soft round sprite texture — WebGL points are square by default, this makes them round
function makeDotTexture(){
  const cv=document.createElement('canvas');cv.width=64;cv.height=64;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.4,'rgba(255,255,255,0.6)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}
const DOT=makeDotTexture();

// ===== STARS =====
const sC=Math.floor(6000*PERF),sG=new THREE.BufferGeometry(),sP=new Float32Array(sC*3),sS=new Float32Array(sC);
for(let i=0;i<sC*3;i+=3){const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=20+Math.random()*60;sP[i]=r*Math.sin(p)*Math.cos(t);sP[i+1]=r*Math.sin(p)*Math.sin(t);sP[i+2]=r*Math.cos(p);sS[i/3]=0.05+Math.random()*0.3;}
sG.setAttribute('position',new THREE.BufferAttribute(sP,3));
const sM=new THREE.PointsMaterial({size:0.08,map:DOT,color:0xf0e6ff,transparent:true,opacity:0.6,depthWrite:false,blending:THREE.AdditiveBlending});
const stars=new THREE.Points(sG,sM);S.add(stars);

// ===== SHOOTING STARS =====
const shC=Math.floor(20*PERF)||8,shG=new THREE.BufferGeometry(),shP=new Float32Array(shC*3),shV=[];
for(let i=0;i<shC;i++){shP[i*3]=(Math.random()-0.5)*80;shP[i*3+1]=(Math.random()-0.5)*80;shP[i*3+2]=(Math.random()-0.5)*80-10;shV.push({x:(Math.random()-0.5)*0.5,y:(Math.random()-0.5)*0.5,z:Math.random()*0.3+0.1});}
shG.setAttribute('position',new THREE.BufferAttribute(shP,3));
const shM=new THREE.PointsMaterial({size:0.15,map:DOT,color:0xb8a9ff,transparent:true,opacity:0.8,depthWrite:false,blending:THREE.AdditiveBlending});
const shooters=new THREE.Points(shG,shM);S.add(shooters);

// ===== ROCKETS =====
function makeRocket(x,y,z){
  const g=new THREE.Group();
  // Body
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.6,8),new THREE.MeshBasicMaterial({color:0xb8a9ff}));
  body.rotation.x=Math.PI/2;g.add(body);
  // Nose
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.2,8),new THREE.MeshBasicMaterial({color:0xff6b9d}));
  nose.position.x=0.35;nose.rotation.z=-Math.PI/2;g.add(nose);
  // Fins
  for(let i=0;i<3;i++){const f=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.08,0.15,4),new THREE.MeshBasicMaterial({color:0xb8a9ff}));f.rotation.x=Math.PI/2;f.position.set(-0.25,0.08*Math.sin(i*2.1),0.08*Math.cos(i*2.1));g.add(f);}
  g.position.set(x,y,z);return g;
}
const rockets=[];
for(let i=0;i<8;i++){
  const r=makeRocket((Math.random()-0.5)*50,(Math.random()-0.5)*40,(Math.random()-0.5)*30-5);
  rockets.push({obj:r,spd:0.02+Math.random()*0.04,rot:Math.random()*0.02});S.add(r);
}

// ===== LIGHTING (needed for shaded planet spheres) =====
S.add(new THREE.AmbientLight(0x2a2a40,0.35));
const sunLight=new THREE.PointLight(0xfff2e0,3.2,400,1.6);
sunLight.position.set(30,15,90);S.add(sunLight);
const rimLight=new THREE.DirectionalLight(0x7d9fff,0.5);
rimLight.position.set(-50,20,-60);S.add(rimLight);

// Procedural planet surface texture — continents/craters/bands + fine grain,
// so planets read as real textured worlds instead of flat computer-3D balls.
function makePlanetTexture(hexColor,{bands=false,spots=10}={}){
  const w=512,h=256,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');
  const base=new THREE.Color(hexColor);
  ctx.fillStyle=`rgb(${base.r*255|0},${base.g*255|0},${base.b*255|0})`;
  ctx.fillRect(0,0,w,h);

  if(bands){
    const bandCount=8+Math.floor(Math.random()*6);
    for(let i=0;i<bandCount;i++){
      const y=(i/bandCount)*h,bh=h/bandCount*(0.7+Math.random()*0.6);
      const c=base.clone().offsetHSL(0,0,(Math.random()-0.5)*0.28);
      ctx.fillStyle=`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},${0.5+Math.random()*0.4})`;
      ctx.fillRect(0,y,w,bh);
    }
  }

  for(let i=0;i<spots*7;i++){
    const x=Math.random()*w,y=Math.random()*h,rad=4+Math.random()*(bands?60:32);
    const c=base.clone().offsetHSL((Math.random()-0.5)*0.03,0,(Math.random()-0.5)*0.32);
    const grad=ctx.createRadialGradient(x,y,0,x,y,rad);
    grad.addColorStop(0,`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0.55)`);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();
  }

  const img=ctx.getImageData(0,0,w,h);
  for(let i=0;i<img.data.length;i+=4){
    const n=(Math.random()-0.5)*16;
    img.data[i]=Math.min(255,Math.max(0,img.data[i]+n));
    img.data[i+1]=Math.min(255,Math.max(0,img.data[i+1]+n));
    img.data[i+2]=Math.min(255,Math.max(0,img.data[i+2]+n));
  }
  ctx.putImageData(img,0,0);

  // Bump map — grayscale relief derived from the same surface detail, so
  // craters/continents/bands actually catch light instead of looking flat-painted
  const bumpCv=document.createElement('canvas');bumpCv.width=w;bumpCv.height=h;
  const bctx=bumpCv.getContext('2d');
  const bImg=bctx.createImageData(w,h);
  for(let i=0;i<img.data.length;i+=4){
    const lum=img.data[i]*0.299+img.data[i+1]*0.587+img.data[i+2]*0.114;
    bImg.data[i]=bImg.data[i+1]=bImg.data[i+2]=lum;bImg.data[i+3]=255;
  }
  bctx.putImageData(bImg,0,0);

  const tex=new THREE.CanvasTexture(cv);
  tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.ClampToEdgeWrapping;
  tex.encoding=THREE.sRGBEncoding;
  const bumpTex=new THREE.CanvasTexture(bumpCv);
  bumpTex.wrapS=THREE.RepeatWrapping;bumpTex.wrapT=THREE.ClampToEdgeWrapping;
  return {map:tex,bump:bumpTex};
}

// ===== PLANETS — huge, constantly orbiting; one looms close to camera =====
const ORBIT_CENTER={x:0,y:0,z:-58};
const PLANETS=[
  {name:'Terra Rosa',  color:0xd8623a, size:6,   ring:false, bands:false, atmo:0xffb08a, orbitR:20, speed:0.075, phase:0.0, yAmp:3},
  {name:'Cobalt',      color:0x3a6fd8, size:5,   ring:false, bands:false, atmo:0x9fc4ff, orbitR:30, speed:0.06,  phase:1.2, yAmp:4},
  {name:'Amberion',    color:0xb8823a, size:9,   ring:true,  bands:true,  atmo:null,     orbitR:40, speed:0.045, phase:2.5, yAmp:3},
  {name:'Emerald Veil',color:0x2fae7a, size:5.5, ring:false, bands:false, atmo:0x8affc0, orbitR:50, speed:0.038, phase:3.7, yAmp:4.5},
  {name:'Frost',       color:0x9fd8e8, size:4.5, ring:false, bands:false, atmo:0xd0f0ff, orbitR:60, speed:0.03,  phase:5.0, yAmp:4},
];
// Hero planet — huge, drifts close in the foreground so it always feels near
const HERO_PLANET={name:'Nebulon', color:0x8a5ad8, size:11, ring:false, bands:true, atmo:0xc9a8ff};

function buildPlanet(p){
  const g=new THREE.Group();
  const tex=makePlanetTexture(p.color,{bands:p.bands,spots:p.bands?6:12});
  const sphere=new THREE.Mesh(
    new THREE.SphereGeometry(p.size,64,64),
    new THREE.MeshStandardMaterial({map:tex.map,bumpMap:tex.bump,bumpScale:p.size*0.06,roughness:0.9,metalness:0.04})
  );
  g.add(sphere);
  if(p.atmo){
    const atmo=new THREE.Mesh(
      new THREE.SphereGeometry(p.size*1.1,32,32),
      new THREE.MeshBasicMaterial({color:p.atmo,transparent:true,opacity:0.18,side:THREE.BackSide,blending:THREE.AdditiveBlending})
    );
    g.add(atmo);
  }
  if(p.ring){
    const ring=new THREE.Mesh(
      new THREE.RingGeometry(p.size*1.4,p.size*2.1,64),
      new THREE.MeshStandardMaterial({color:0xcbb8e8,roughness:0.9,side:THREE.DoubleSide,transparent:true,opacity:0.55})
    );
    ring.rotation.x=Math.PI/2.3;g.add(ring);
  }
  g.rotation.z=(Math.random()-0.5)*0.5;
  S.add(g);
  return g;
}

const planetMeshes=PLANETS.map(p=>({obj:buildPlanet(p),spin:0.1+Math.random()*0.15,orbitR:p.orbitR,speed:p.speed,phase:p.phase,yAmp:p.yAmp}));
const heroObj=buildPlanet(HERO_PLANET);
const heroPlanet={obj:heroObj,spin:0.08};

// ===== ASTEROID BELT (rocky dust ring, replaces old golden "flowers" ring) =====
const fC=Math.floor(400*PERF),fG=new THREE.BufferGeometry(),fPos=new Float32Array(fC*3);
for(let i=0;i<fC*3;i+=3){const r=5+Math.random()*15,a=Math.random()*Math.PI*2;fPos[i]=Math.cos(a)*r;fPos[i+1]=Math.sin(a)*r*0.6;fPos[i+2]=(Math.random()-0.5)*10-40;}
fG.setAttribute('position',new THREE.BufferAttribute(fPos,3));
const fMat=new THREE.PointsMaterial({size:0.1,map:DOT,color:0x9a8f8a,transparent:true,opacity:0.5,depthWrite:false});
const asteroids=new THREE.Points(fG,fMat);S.add(asteroids);

// ===== NEBULA =====
const nC=Math.floor(3000*PERF),nG=new THREE.BufferGeometry(),nP=new Float32Array(nC*3),nCol=new Float32Array(nC*3);
for(let i=0;i<nC;i++){
  const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=10+Math.random()*25;
  nP[i*3]=r*Math.sin(p)*Math.cos(t);nP[i*3+1]=r*Math.sin(p)*Math.sin(t);nP[i*3+2]=r*Math.cos(p)-5;
  const c=new THREE.Color().setHSL(0.75+Math.random()*0.15,0.6,0.1+Math.random()*0.15);
  nCol[i*3]=c.r;nCol[i*3+1]=c.g;nCol[i*3+2]=c.b;
}
nG.setAttribute('position',new THREE.BufferAttribute(nP,3));nG.setAttribute('color',new THREE.BufferAttribute(nCol,3));
const nMat=new THREE.PointsMaterial({size:0.2,map:DOT,vertexColors:true,transparent:true,opacity:0.12,depthWrite:false,blending:THREE.AdditiveBlending});
const nebula=new THREE.Points(nG,nMat);S.add(nebula);

// ===== GSAP =====
gsap.to('#badge',{opacity:1,duration:1.2,delay:0.3});
gsap.to('#h1',{opacity:1,y:0,duration:1.8,ease:'power4.out',delay:0.6});
gsap.to('#sub',{opacity:1,y:0,duration:1.5,ease:'power3.out',delay:1.0});
gsap.to('#ctaBtn',{opacity:1,duration:1.2,delay:1.4});
gsap.to('#ctaBtn2',{opacity:1,duration:1.2,delay:1.6});
gsap.to('#sHint',{opacity:1,duration:1.5,delay:2.0});

const SP={p:0};
gsap.to(SP,{p:1,ease:'none',scrollTrigger:{trigger:'body',start:'top top',end:'bottom bottom',scrub:1.5}});

// ===== MOUSE =====
const MX={x:0,y:0};
gsap.quickTo(MX,'x',{duration:0.6,ease:'power3.out'});
gsap.quickTo(MX,'y',{duration:0.6,ease:'power3.out'});
window.addEventListener('mousemove',e=>{MX.x=(e.clientX/window.innerWidth)*2-1;MX.y=-(e.clientY/window.innerHeight)*2+1;});

let CLK=new THREE.Clock();
function tick(){
  const t=CLK.getElapsedTime();
  
  // Space rotation
  stars.rotation.y=t*0.005;stars.rotation.x=t*0.002;
  nebula.rotation.y=t*0.003;asteroids.rotation.y=t*0.02;
  
  // Planets — continuous orbital motion around a shared center, plus self-spin
  planetMeshes.forEach(p=>{
    const angle=t*p.speed+p.phase;
    p.obj.position.x=ORBIT_CENTER.x+Math.cos(angle)*p.orbitR;
    p.obj.position.z=ORBIT_CENTER.z+Math.sin(angle)*p.orbitR*0.6;
    p.obj.position.y=ORBIT_CENTER.y+Math.sin(angle*0.6)*p.yAmp;
    p.obj.rotation.y=t*p.spin;
  });
  // Hero planet — huge, drifts slowly close to the camera, always in motion
  heroPlanet.obj.position.x=10*Math.sin(t*0.045);
  heroPlanet.obj.position.y=-4+3.5*Math.sin(t*0.035+1.4);
  heroPlanet.obj.position.z=-10+7*Math.sin(t*0.03);
  heroPlanet.obj.rotation.y=t*heroPlanet.spin;
  
  // Rockets
  rockets.forEach((r,i)=>{
    r.obj.position.x+=Math.sin(t*r.spd*2+i)*0.03;
    r.obj.position.y+=Math.cos(t*r.spd*1.5+i)*0.03;
    r.obj.position.z+=Math.sin(t*r.spd+i)*0.02;
    r.obj.rotation.y+=r.rot;
    r.obj.rotation.x+=Math.sin(t*0.5+i)*0.01;
  });
  
  // Shooting stars
  const sh=shG.attributes.position.array;
  for(let i=0;i<shC;i++){
    sh[i*3]+=shV[i].x;sh[i*3+1]+=shV[i].y;sh[i*3+2]+=shV[i].z;
    if(sh[i*3]>40||sh[i*3]<-40||sh[i*3+1]>40||sh[i*3+1]<-40){sh[i*3]=(Math.random()-0.5)*80;sh[i*3+1]=(Math.random()-0.5)*80;sh[i*3+2]=(Math.random()-0.5)*80-10;}
  }
  shG.attributes.position.needsUpdate=true;
  
  // Sp = scroll progress + slow autonomous drift — camera gently cruises through space on its own, on top of scroll and mouse parallax
  const sp=SP.p;
  M.position.z=THREE.MathUtils.lerp(40,32,sp)+Math.sin(t*0.015)*9;
  M.position.x=MX.x*2+Math.sin(t*0.011)*4;
  M.position.y=MX.y*2+Math.cos(t*0.009)*2.5;
  M.lookAt(0,0,ORBIT_CENTER.z);
  
  r.render(S,M);requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize',()=>{
  M.aspect=window.innerWidth/window.innerHeight;M.updateProjectionMatrix();
  r.setSize(window.innerWidth,window.innerHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));
  ScrollTrigger.refresh();
});
</script>
</body>
</html>
