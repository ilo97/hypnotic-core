<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Studio</title>
<meta name="description" content="Aesthetic Studio – scroll-triggered 3D web experiences that turn visitors into buyers. Prompt-to-3D landing pages, hypnotic motion, sound design.">
<meta property="og:title" content="Aesthetic Studio">
<meta property="og:description" content="Scroll-triggered 3D web experiences that turn visitors into buyers.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ilo97.github.io/hypnotic-core/">
<meta property="og:image" content="https://ilo97.github.io/hypnotic-core/assets/example1.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Aesthetic Studio">
<meta name="twitter:description" content="Scroll-triggered 3D web experiences that turn visitors into buyers.">
<meta name="twitter:image" content="https://ilo97.github.io/hypnotic-core/assets/example1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#f0e6ff;font-family:'Inter',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;cursor:crosshair}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.overlay{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px;text-align:center;pointer-events:none}
.overlay>*{pointer-events:auto}
.badge{font-size:8px;letter-spacing:.5em;text-transform:uppercase;color:rgba(212,175,55,0.2);margin-bottom:15px;opacity:0}
h1{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(36px,6vw,72px);font-weight:400;background:linear-gradient(180deg,#f0e6ff 0%,rgba(212,175,55,0.3) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;opacity:0;transform:translateY(30px)}
h1 em{background:linear-gradient(135deg,#ff6b9d,#d4a0ff,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:clamp(13px,1.5vw,18px);font-weight:200;color:rgba(240,230,255,0.15);margin-bottom:30px;opacity:0;transform:translateY(15px);letter-spacing:.05em}
.cta{padding:14px 40px;border:1px solid #d4af37;color:#d4af37;font-size:9px;letter-spacing:.3em;text-transform:uppercase;background:transparent;cursor:pointer;transition:all .5s;text-decoration:none;opacity:0;font-family:'Inter',sans-serif}
.cta:hover{background:#d4af37;color:#050510}
.scroll-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:7px;letter-spacing:.4em;text-transform:uppercase;color:rgba(212,175,55,0.1);opacity:0}
.gld-line{width:1px;height:30px;background:linear-gradient(to bottom,#d4af37,transparent);margin:6px auto 0;animation:br 3s infinite}
@keyframes br{0%{opacity:.2;transform:scaleY(.3);transform-origin:top}50%{opacity:1;transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{opacity:.2;transform:scaleY(.3);transform-origin:bottom}}
footer{padding:15px 40px;display:flex;justify-content:space-between;font-size:7px;letter-spacing:.25em;text-transform:uppercase;color:rgba(240,230,255,0.03);border-top:1px solid rgba(212,175,55,0.01);position:relative;z-index:1}
@media(max-width:768px){h1{font-size:clamp(24px,8vw,36px)}.overlay{padding:30px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="badge" id="badge">✦ Aesthetic Studio ✦</div>
  <h1 id="h1">Ready to build<br><em>something unforgettable?</em></h1>
  <div class="sub" id="sub">Welcome to the cosmic creative universe.<br>Scroll to explore endless possibilities.</div>
  <a class="cta" id="ctaBtn" href="mailto:hi@aesthetic.studio">✦ Let's Begin</a>
  <a class="cta" id="ctaBtn2" href="platform-index.html" style="margin-top:10px;opacity:0">✦ Explore the Platform</a>
  <div class="scroll-hint" id="sHint"><span>Scroll</span><div class="gld-line"></div></div>
</div>
<footer><span>© 2026 Aesthetic Studio</span><a href="platform-index.html" style="color:rgba(212,175,55,0.4);text-decoration:none;letter-spacing:.25em;font-size:7px;text-transform:uppercase">Enter the Platform →</a><span>✦ Aesthetic Studio ✦</span></footer>

<script>
gsap.registerPlugin(ScrollTrigger);

const c=document.getElementById('c'),r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});
r.setSize(window.innerWidth,window.innerHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));
const S=new THREE.Scene(),M=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
M.position.z=40;
const PERF=window.innerWidth<480?0.7:1;

// Soft round sprite texture — WebGL points are square by default, this makes them round
function makeDotTexture(){
  const cv=document.createElement('canvas');cv.width=64;cv.height=64;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.4,'rgba(255,255,255,0.6)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}
const DOT=makeDotTexture();

// ===== STARS =====
const sC=Math.floor(6000*PERF),sG=new THREE.BufferGeometry(),sP=new Float32Array(sC*3),sS=new Float32Array(sC);
for(let i=0;i<sC*3;i+=3){const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=20+Math.random()*60;sP[i]=r*Math.sin(p)*Math.cos(t);sP[i+1]=r*Math.sin(p)*Math.sin(t);sP[i+2]=r*Math.cos(p);sS[i/3]=0.05+Math.random()*0.3;}
sG.setAttribute('position',new THREE.BufferAttribute(sP,3));
const sM=new THREE.PointsMaterial({size:0.08,map:DOT,color:0xf0e6ff,transparent:true,opacity:0.6,depthWrite:false,blending:THREE.AdditiveBlending});
const stars=new THREE.Points(sG,sM);S.add(stars);

// ===== SHOOTING STARS =====
const shC=Math.floor(20*PERF)||8,shG=new THREE.BufferGeometry(),shP=new Float32Array(shC*3),shV=[];
for(let i=0;i<shC;i++){shP[i*3]=(Math.random()-0.5)*80;shP[i*3+1]=(Math.random()-0.5)*80;shP[i*3+2]=(Math.random()-0.5)*80-10;shV.push({x:(Math.random()-0.5)*0.5,y:(Math.random()-0.5)*0.5,z:Math.random()*0.3+0.1});}
shG.setAttribute('position',new THREE.BufferAttribute(shP,3));
const shM=new THREE.PointsMaterial({size:0.15,map:DOT,color:0xffd700,transparent:true,opacity:0.8,depthWrite:false,blending:THREE.AdditiveBlending});
const shooters=new THREE.Points(shG,shM);S.add(shooters);

// ===== ROCKETS =====
function makeRocket(x,y,z){
  const g=new THREE.Group();
  // Body
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.6,8),new THREE.MeshBasicMaterial({color:0xd4af37}));
  body.rotation.x=Math.PI/2;g.add(body);
  // Nose
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.2,8),new THREE.MeshBasicMaterial({color:0xff6b9d}));
  nose.position.x=0.35;nose.rotation.z=-Math.PI/2;g.add(nose);
  // Fins
  for(let i=0;i<3;i++){const f=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.08,0.15,4),new THREE.MeshBasicMaterial({color:0xffd700}));f.rotation.x=Math.PI/2;f.position.set(-0.25,0.08*Math.sin(i*2.1),0.08*Math.cos(i*2.1));g.add(f);}
  g.position.set(x,y,z);return g;
}
const rockets=[];
for(let i=0;i<8;i++){
  const r=makeRocket((Math.random()-0.5)*50,(Math.random()-0.5)*40,(Math.random()-0.5)*30-5);
  rockets.push({obj:r,spd:0.02+Math.random()*0.04,rot:Math.random()*0.02});S.add(r);
}

// ===== CHASING PIXELS =====
const pC=Math.floor(500*PERF),pG=new THREE.BufferGeometry(),pPos=new Float32Array(pC*3),pVel=[],pCol=[];
for(let i=0;i<pC;i++){
  pPos[i*3]=(Math.random()-0.5)*40;pPos[i*3+1]=(Math.random()-0.5)*40;pPos[i*3+2]=(Math.random()-0.5)*20;
  pVel.push({x:(Math.random()-0.5)*0.1,y:(Math.random()-0.5)*0.1});
  pCol.push(new THREE.Color().setHSL(Math.random(),0.8,0.6));
}
pG.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const pMat=new THREE.PointsMaterial({size:0.12,map:DOT,vertexColors:true,transparent:true,opacity:0.7,depthWrite:false,blending:THREE.AdditiveBlending});
const pixels=new THREE.Points(pG,pMat);S.add(pixels);

// ===== FLOATING DRINKS (pixel art) =====
const dC=Math.floor(30*PERF)||10,dG=new THREE.BufferGeometry(),dPos=new Float32Array(dC*3),dCol=new Float32Array(dC*3),dS=new Float32Array(dC);
for(let i=0;i<dC;i++){
  dPos[i*3]=(Math.random()-0.5)*40;dPos[i*3+1]=(Math.random()-0.5)*30;dPos[i*3+2]=(Math.random()-0.5)*20-5;
  const c=new THREE.Color().setHSL(0.05+Math.random()*0.1,0.8,0.5+Math.random()*0.3);
  dCol[i*3]=c.r;dCol[i*3+1]=c.g;dCol[i*3+2]=c.b;dS[i]=0.2+Math.random()*0.3;
}
dG.setAttribute('position',new THREE.BufferAttribute(dPos,3));
dG.setAttribute('color',new THREE.BufferAttribute(dCol,3));
dG.setAttribute('size',new THREE.BufferAttribute(dS,1));
const dMat=new THREE.PointsMaterial({size:0.2,map:DOT,vertexColors:true,transparent:true,opacity:0.5,depthWrite:false,blending:THREE.AdditiveBlending});
const drinks=new THREE.Points(dG,dMat);S.add(drinks);

// ===== FASHION/ANIMAL PIXELS =====
const aC=Math.floor(200*PERF),aG=new THREE.BufferGeometry(),aPos=new Float32Array(aC*3),aCol=new Float32Array(aC*3);
for(let i=0;i<aC;i++){
  aPos[i*3]=(Math.random()-0.5)*35;aPos[i*3+1]=(Math.random()-0.5)*35;aPos[i*3+2]=(Math.random()-0.5)*15;
  const c=new THREE.Color().setHSL(0.6+Math.random()*0.2,0.7,0.5+Math.random()*0.3);
  aCol[i*3]=c.r;aCol[i*3+1]=c.g;aCol[i*3+2]=c.b;
}
aG.setAttribute('position',new THREE.BufferAttribute(aPos,3));
aG.setAttribute('color',new THREE.BufferAttribute(aCol,3));
const aMat=new THREE.PointsMaterial({size:0.15,map:DOT,vertexColors:true,transparent:true,opacity:0.6,depthWrite:false,blending:THREE.AdditiveBlending});
const animals=new THREE.Points(aG,aMat);S.add(animals);

// ===== PIXEL DRINKS FLOWERS =====
const fC=Math.floor(400*PERF),fG=new THREE.BufferGeometry(),fPos=new Float32Array(fC*3);
for(let i=0;i<fC*3;i+=3){const r=5+Math.random()*15,a=Math.random()*Math.PI*2;fPos[i]=Math.cos(a)*r;fPos[i+1]=Math.sin(a)*r*0.6;fPos[i+2]=(Math.random()-0.5)*10;}
fG.setAttribute('position',new THREE.BufferAttribute(fPos,3));
const fMat=new THREE.PointsMaterial({size:0.08,map:DOT,color:0xffd700,transparent:true,opacity:0.3,depthWrite:false,blending:THREE.AdditiveBlending});
const flowers=new THREE.Points(fG,fMat);S.add(flowers);

// ===== NEBULA =====
const nC=Math.floor(3000*PERF),nG=new THREE.BufferGeometry(),nP=new Float32Array(nC*3),nCol=new Float32Array(nC*3);
for(let i=0;i<nC;i++){
  const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=10+Math.random()*25;
  nP[i*3]=r*Math.sin(p)*Math.cos(t);nP[i*3+1]=r*Math.sin(p)*Math.sin(t);nP[i*3+2]=r*Math.cos(p)-5;
  const c=new THREE.Color().setHSL(0.75+Math.random()*0.15,0.6,0.1+Math.random()*0.15);
  nCol[i*3]=c.r;nCol[i*3+1]=c.g;nCol[i*3+2]=c.b;
}
nG.setAttribute('position',new THREE.BufferAttribute(nP,3));nG.setAttribute('color',new THREE.BufferAttribute(nCol,3));
const nMat=new THREE.PointsMaterial({size:0.2,map:DOT,vertexColors:true,transparent:true,opacity:0.12,depthWrite:false,blending:THREE.AdditiveBlending});
const nebula=new THREE.Points(nG,nMat);S.add(nebula);

// ===== GSAP =====
gsap.to('#badge',{opacity:1,duration:1.2,delay:0.3});
gsap.to('#h1',{opacity:1,y:0,duration:1.8,ease:'power4.out',delay:0.6});
gsap.to('#sub',{opacity:1,y:0,duration:1.5,ease:'power3.out',delay:1.0});
gsap.to('#ctaBtn',{opacity:1,duration:1.2,delay:1.4});
gsap.to('#ctaBtn2',{opacity:1,duration:1.2,delay:1.6});
gsap.to('#sHint',{opacity:1,duration:1.5,delay:2.0});

const SP={p:0};
gsap.to(SP,{p:1,ease:'none',scrollTrigger:{trigger:'body',start:'top top',end:'bottom bottom',scrub:1.5}});

// ===== MOUSE =====
const MX={x:0,y:0};
gsap.quickTo(MX,'x',{duration:0.6,ease:'power3.out'});
gsap.quickTo(MX,'y',{duration:0.6,ease:'power3.out'});
window.addEventListener('mousemove',e=>{MX.x=(e.clientX/window.innerWidth)*2-1;MX.y=-(e.clientY/window.innerHeight)*2+1;});

let CLK=new THREE.Clock();
function tick(){
  const t=CLK.getElapsedTime();
  
  // Space rotation
  stars.rotation.y=t*0.005;stars.rotation.x=t*0.002;
  nebula.rotation.y=t*0.003;flowers.rotation.y=t*0.008;flowers.rotation.x=t*0.005;
  
  // Rockets
  rockets.forEach((r,i)=>{
    r.obj.position.x+=Math.sin(t*r.spd*2+i)*0.03;
    r.obj.position.y+=Math.cos(t*r.spd*1.5+i)*0.03;
    r.obj.position.z+=Math.sin(t*r.spd+i)*0.02;
    r.obj.rotation.y+=r.rot;
    r.obj.rotation.x+=Math.sin(t*0.5+i)*0.01;
  });
  
  // Shooting stars
  const sh=shG.attributes.position.array;
  for(let i=0;i<shC;i++){
    sh[i*3]+=shV[i].x;sh[i*3+1]+=shV[i].y;sh[i*3+2]+=shV[i].z;
    if(sh[i*3]>40||sh[i*3]<-40||sh[i*3+1]>40||sh[i*3+1]<-40){sh[i*3]=(Math.random()-0.5)*80;sh[i*3+1]=(Math.random()-0.5)*80;sh[i*3+2]=(Math.random()-0.5)*80-10;}
  }
  shG.attributes.position.needsUpdate=true;
  
  // Chasing pixels
  const pp=pG.attributes.position.array;
  for(let i=0;i<pC;i++){
    const target=i>0?i-1:(pC-1);
    pp[i*3]+=(pp[target*3]-pp[i*3])*0.003+pVel[i].x;
    pp[i*3+1]+=(pp[target*3+1]-pp[i*3+1])*0.003+pVel[i].y;
    pp[i*3+2]+=Math.sin(t*0.3+i)*0.01;
    if(Math.abs(pp[i*3])>20){pVel[i].x*=-1;}
    if(Math.abs(pp[i*3+1])>20){pVel[i].y*=-1;}
  }
  pG.attributes.position.needsUpdate=true;
  
  // Floating drinks
  const dp=dG.attributes.position.array;
  for(let i=0;i<dC;i++){
    dp[i*3]+=Math.sin(t*0.5+i)*0.008;
    dp[i*3+1]+=Math.cos(t*0.7+i*1.3)*0.008;
    dp[i*3+2]+=Math.sin(t*0.3+i*0.7)*0.005;
  }
  dG.attributes.position.needsUpdate=true;
  
  // Animals
  const ap=aG.attributes.position.array;
  for(let i=0;i<aC;i++){
    ap[i*3]+=Math.sin(t*0.2+i*2)*0.01;
    ap[i*3+1]+=Math.cos(t*0.3+i*1.5)*0.01;
    ap[i*3+2]+=Math.sin(t*0.1+i)*0.008;
  }
  aG.attributes.position.needsUpdate=true;
  
  // Sp = scroll progress
  const sp=SP.p;
  M.position.z=THREE.MathUtils.lerp(40,28,sp);
  M.position.x=MX.x*2;
  M.position.y=MX.y*2;
  
  r.render(S,M);requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize',()=>{
  M.aspect=window.innerWidth/window.innerHeight;M.updateProjectionMatrix();
  r.setSize(window.innerWidth,window.innerHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));
  ScrollTrigger.refresh();
});
</script>
</body>
</html>
