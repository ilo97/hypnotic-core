<script>
gsap.registerPlugin(ScrollTrigger);

const c=document.getElementById('c'),r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});
r.setSize(window.innerWidth,window.innerHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));
r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.15;
const S=new THREE.Scene(),M=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
M.position.z=40;
const PERF=window.innerWidth<480?0.7:1;

// Soft round sprite texture — WebGL points are square by default, this makes them round
function makeDotTexture(){
  const cv=document.createElement('canvas');cv.width=64;cv.height=64;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.4,'rgba(255,255,255,0.6)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}
const DOT=makeDotTexture();

// Fresnel-based atmosphere glow — bright rim halo like a real planet limb,
// instead of a flat uniform tint. Classic glow-shader technique.
function makeGlowMaterial(hexColor,power){
  return new THREE.ShaderMaterial({
    uniforms:{glowColor:{value:new THREE.Color(hexColor)}},
    vertexShader:`varying vec3 vNormal;
      void main(){
        vNormal=normalize(normalMatrix*normal);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
      }`,
    fragmentShader:`varying vec3 vNormal;uniform vec3 glowColor;
      void main(){
        float intensity=pow(0.72-dot(vNormal,vec3(0.0,0.0,1.0)),${power.toFixed(1)});
        gl_FragColor=vec4(glowColor,1.0)*intensity;
      }`,
    side:THREE.BackSide,
    blending:THREE.AdditiveBlending,
    transparent:true,
    depthWrite:false
  });
}

// ===== STARS =====
const sC=Math.floor(6000*PERF),sG=new THREE.BufferGeometry(),sP=new Float32Array(sC*3),sS=new Float32Array(sC);
for(let i=0;i<sC*3;i+=3){const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=20+Math.random()*60;sP[i]=r*Math.sin(p)*Math.cos(t);sP[i+1]=r*Math.sin(p)*Math.sin(t);sP[i+2]=r*Math.cos(p);sS[i/3]=0.05+Math.random()*0.3;}
sG.setAttribute('position',new THREE.BufferAttribute(sP,3));
const sM=new THREE.PointsMaterial({size:0.08,map:DOT,color:0xf0e6ff,transparent:true,opacity:0.6,depthWrite:false,blending:THREE.AdditiveBlending});
const stars=new THREE.Points(sG,sM);S.add(stars);

// ===== SHOOTING STARS =====
const shC=Math.floor(20*PERF)||8,shG=new THREE.BufferGeometry(),shP=new Float32Array(shC*3),shV=[];
for(let i=0;i<shC;i++){shP[i*3]=(Math.random()-0.5)*80;shP[i*3+1]=(Math.random()-0.5)*80;shP[i*3+2]=(Math.random()-0.5)*80-10;shV.push({x:(Math.random()-0.5)*0.5,y:(Math.random()-0.5)*0.5,z:Math.random()*0.3+0.1});}
shG.setAttribute('position',new THREE.BufferAttribute(shP,3));
const shM=new THREE.PointsMaterial({size:0.15,map:DOT,color:0xb8a9ff,transparent:true,opacity:0.8,depthWrite:false,blending:THREE.AdditiveBlending});
const shooters=new THREE.Points(shG,shM);S.add(shooters);

// ===== ROCKETS =====
function makeRocket(x,y,z){
  const g=new THREE.Group();
  // Body
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.6,8),new THREE.MeshBasicMaterial({color:0xb8a9ff}));
  body.rotation.x=Math.PI/2;g.add(body);
  // Nose
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.2,8),new THREE.MeshBasicMaterial({color:0xff6b9d}));
  nose.position.x=0.35;nose.rotation.z=-Math.PI/2;g.add(nose);
  // Fins
  for(let i=0;i<3;i++){const f=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.08,0.15,4),new THREE.MeshBasicMaterial({color:0xb8a9ff}));f.rotation.x=Math.PI/2;f.position.set(-0.25,0.08*Math.sin(i*2.1),0.08*Math.cos(i*2.1));g.add(f);}
  g.position.set(x,y,z);return g;
}
const rockets=[];
for(let i=0;i<8;i++){
  const r=makeRocket((Math.random()-0.5)*50,(Math.random()-0.5)*40,(Math.random()-0.5)*30-5);
  rockets.push({obj:r,spd:0.02+Math.random()*0.04,rot:Math.random()*0.02});S.add(r);
}

// ===== LIGHTING (needed for shaded planet spheres) =====
S.add(new THREE.AmbientLight(0x2a2a40,0.35));
const sunLight=new THREE.PointLight(0xfff2e0,3.2,400,1.6);
sunLight.position.set(30,15,90);S.add(sunLight);
const rimLight=new THREE.DirectionalLight(0x7d9fff,0.5);
rimLight.position.set(-50,20,-60);S.add(rimLight);

// ===== REALISTIC PROCEDURAL PLANET TEXTURES =====
// Fractal (fBm) value noise — the same technique behind real terrain/cloud
// generators — replaces the old scattered-blob look with continuous,
// organic coastlines, cloud swirls, and crater fields.
function makeNoise2D(seed){
  function hash(x,y){
    let n=x*374761393+y*668265263+seed*2246822519;
    n=(n^(n>>>13))>>>0;n=Math.imul(n,1274126177)>>>0;n=(n^(n>>>16))>>>0;
    return n/4294967295;
  }
  function smooth(t){return t*t*(3-2*t);}
  return function(x,y){
    const x0=Math.floor(x),y0=Math.floor(y),x1=x0+1,y1=y0+1;
    const sx=smooth(x-x0),sy=smooth(y-y0);
    const n00=hash(x0,y0),n10=hash(x1,y0),n01=hash(x0,y1),n11=hash(x1,y1);
    const ix0=n00+(n10-n00)*sx,ix1=n01+(n11-n01)*sx;
    return ix0+(ix1-ix0)*sy;
  };
}
function fbm(noise,x,y,octaves,lacunarity,gain){
  let sum=0,amp=0.5,freq=1,norm=0;
  for(let i=0;i<octaves;i++){sum+=noise(x*freq,y*freq)*amp;norm+=amp;freq*=lacunarity;amp*=gain;}
  return sum/norm;
}
function smoothstep(e0,e1,x){const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);}
function lerpC(c1,c2,t){return [c1[0]+(c2[0]-c1[0])*t,c1[1]+(c2[1]-c1[1])*t,c1[2]+(c2[2]-c1[2])*t];}

function finishTexture(cv,ctx,w,h){
  const img=ctx.getImageData(0,0,w,h);
  const bumpCv=document.createElement('canvas');bumpCv.width=w;bumpCv.height=h;
  const bctx=bumpCv.getContext('2d');const bImg=bctx.createImageData(w,h);
  for(let i=0;i<img.data.length;i+=4){
    const lum=img.data[i]*0.299+img.data[i+1]*0.587+img.data[i+2]*0.114;
    bImg.data[i]=bImg.data[i+1]=bImg.data[i+2]=lum;bImg.data[i+3]=255;
  }
  bctx.putImageData(bImg,0,0);
  const tex=new THREE.CanvasTexture(cv);
  tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.ClampToEdgeWrapping;tex.encoding=THREE.sRGBEncoding;
  const bumpTex=new THREE.CanvasTexture(bumpCv);
  bumpTex.wrapS=THREE.RepeatWrapping;bumpTex.wrapT=THREE.ClampToEdgeWrapping;
  return {map:tex,bump:bumpTex};
}

// Ocean + continents + clouds, like Terra/Cobalt/Emerald Veil
function makeOceanTexture(seed,oceanDeep,oceanShallow,landLow,landHigh){
  const w=PERF<1?384:768,h=w/2,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d'),img=ctx.createImageData(w,h);
  const landNoise=makeNoise2D(seed),cloudNoise=makeNoise2D(seed+999),detailNoise=makeNoise2D(seed+55);
  for(let py=0;py<h;py++){
    const v=py/h;
    for(let px=0;px<w;px++){
      const u=px/w;
      let land=fbm(landNoise,u*5,v*5,6,2.1,0.55);
      land=Math.pow(Math.max(0,land),1.6);
      const detail=fbm(detailNoise,u*20,v*20,3,2,0.5);
      const landMix=smoothstep(0.47,0.56,land);
      const oceanShade=1-Math.min(1,land/0.47);
      const landShade=Math.min(1,Math.max(0,(land-0.5)/0.4));
      let color=lerpC(oceanDeep,oceanShallow,oceanShade*0.7+detail*0.3);
      color=lerpC(color,lerpC(landLow,landHigh,landShade*0.6+detail*0.4),landMix);
      const coastal=Math.max(0,1-Math.abs(landMix-0.18)/0.16);
      color=lerpC(color,[90,200,200],coastal*0.35);
      let cloud=fbm(cloudNoise,u*7,v*7,5,2.2,0.5);
      cloud=Math.min(1,Math.pow(Math.max(0,cloud-0.44),1.5)*2.4);
      color=lerpC(color,[255,255,255],cloud*0.8);
      const idx=(py*w+px)*4;
      img.data[idx]=color[0];img.data[idx+1]=color[1];img.data[idx+2]=color[2];img.data[idx+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return finishTexture(cv,ctx,w,h);
}

// Continuous mottled rock/ice surface, like Terra Rosa (Mars-like) or Frost
function makeRockyTexture(seed,colorLow,colorMid,colorHigh){
  const w=PERF<1?384:768,h=w/2,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d'),img=ctx.createImageData(w,h);
  const baseNoise=makeNoise2D(seed),detailNoise=makeNoise2D(seed+77),craterNoise=makeNoise2D(seed+133);
  for(let py=0;py<h;py++){
    const v=py/h;
    for(let px=0;px<w;px++){
      const u=px/w;
      let base=fbm(baseNoise,u*4,v*4,5,2.1,0.55);
      const detail=fbm(detailNoise,u*16,v*16,4,2,0.5);
      base=base*0.7+detail*0.3;
      let color=base<0.42?lerpC(colorLow,colorMid,base/0.42):lerpC(colorMid,colorHigh,(base-0.42)/0.58);
      const crater=fbm(craterNoise,u*30,v*30,2,2,0.5);
      if(crater>0.62)color=lerpC(color,colorLow,(crater-0.62)*1.4);
      const idx=(py*w+px)*4;
      img.data[idx]=color[0];img.data[idx+1]=color[1];img.data[idx+2]=color[2];img.data[idx+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return finishTexture(cv,ctx,w,h);
}

// Turbulent horizontal bands, like Amberion/Nebulon gas giants
function makeGasGiantTexture(seed,base){
  const w=PERF<1?384:768,h=w/2,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d'),img=ctx.createImageData(w,h);
  const bandNoise=makeNoise2D(seed),turbNoise=makeNoise2D(seed+42);
  for(let py=0;py<h;py++){
    const v=py/h;
    for(let px=0;px<w;px++){
      const u=px/w;
      const turb=fbm(turbNoise,u*6,v*1.2,4,2,0.5)*0.06;
      const bandY=v*14+turb*4;
      const bandShade=fbm(bandNoise,bandY*0.6,0.5,3,2,0.5)-0.5;
      const swirl=fbm(turbNoise,u*10+v*3,v*10,4,2.3,0.5)-0.5;
      const shade=bandShade*0.5+swirl*0.25;
      const color=[
        Math.min(255,Math.max(0,base[0]*(1+shade))),
        Math.min(255,Math.max(0,base[1]*(1+shade))),
        Math.min(255,Math.max(0,base[2]*(1+shade)))
      ];
      const idx=(py*w+px)*4;
      img.data[idx]=color[0];img.data[idx+1]=color[1];img.data[idx+2]=color[2];img.data[idx+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return finishTexture(cv,ctx,w,h);
}

// ===== PLANETS — huge, constantly orbiting; one looms close to camera =====
const ORBIT_CENTER={x:0,y:0,z:-58};
const PLANETS=[
  {name:'Terra Rosa',  size:6,   ring:false, atmo:0xffb08a, orbitR:20, speed:0.075, phase:0.0, yAmp:3,
    tex:()=>makeRockyTexture(21,[70,32,20],[180,88,48],[235,165,115])},
  {name:'Cobalt',      size:5,   ring:false, atmo:0x9fc4ff, orbitR:30, speed:0.06,  phase:1.2, yAmp:4,
    tex:()=>makeOceanTexture(7,[6,20,55],[50,150,175],[95,115,60],[165,145,100])},
  {name:'Amberion',    size:9,   ring:true,  atmo:null,     orbitR:40, speed:0.045, phase:2.5, yAmp:3,
    tex:()=>makeGasGiantTexture(3,[190,140,70])},
  {name:'Emerald Veil',size:5.5, ring:false, atmo:0x8affc0, orbitR:50, speed:0.038, phase:3.7, yAmp:4.5,
    tex:()=>makeOceanTexture(64,[5,35,40],[40,150,140],[60,120,60],[150,175,110])},
  {name:'Frost',       size:4.5, ring:false, atmo:0xd0f0ff, orbitR:60, speed:0.03,  phase:5.0, yAmp:4,
    tex:()=>makeRockyTexture(88,[70,110,130],[170,210,225],[245,250,255])},
];
// Hero planet — huge, drifts close in the foreground so it always feels near
const HERO_PLANET={name:'Nebulon', size:11, ring:false, atmo:0xc9a8ff,
  tex:()=>makeGasGiantTexture(3,[140,100,190])};

function buildPlanet(p){
  const g=new THREE.Group();
  const tex=p.tex();
  const sphere=new THREE.Mesh(
    new THREE.SphereGeometry(p.size,64,64),
    new THREE.MeshStandardMaterial({map:tex.map,bumpMap:tex.bump,bumpScale:p.size*0.05,roughness:0.9,metalness:0.04})
  );
  g.add(sphere);
  const glowColor=p.atmo||0xaab4ff;
  const glowInner=new THREE.Mesh(new THREE.SphereGeometry(p.size*1.03,48,48),makeGlowMaterial(glowColor,2.2));
  g.add(glowInner);
  const glowOuter=new THREE.Mesh(new THREE.SphereGeometry(p.size*1.25,48,48),makeGlowMaterial(glowColor,4.5));
  g.add(glowOuter);
  if(p.ring){
    const ring=new THREE.Mesh(
      new THREE.RingGeometry(p.size*1.4,p.size*2.1,64),
      new THREE.MeshStandardMaterial({color:0xcbb8e8,roughness:0.9,side:THREE.DoubleSide,transparent:true,opacity:0.55})
    );
    ring.rotation.x=Math.PI/2.3;g.add(ring);
  }
  g.rotation.z=(Math.random()-0.5)*0.5;
  S.add(g);
  return g;
}

const planetMeshes=PLANETS.map(p=>({obj:buildPlanet(p),spin:0.1+Math.random()*0.15,orbitR:p.orbitR,speed:p.speed,phase:p.phase,yAmp:p.yAmp}));
const heroObj=buildPlanet(HERO_PLANET);
const heroPlanet={obj:heroObj,spin:0.08};

// ===== VISIBLE ORBIT PATHS — thin rings tracing each planet's path =====
function makeOrbitLine(orbitR,zScale){
  const pts=[];
  for(let i=0;i<=128;i++){
    const a=(i/128)*Math.PI*2;
    pts.push(new THREE.Vector3(ORBIT_CENTER.x+Math.cos(a)*orbitR,ORBIT_CENTER.y,ORBIT_CENTER.z+Math.sin(a)*orbitR*zScale));
  }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const mat=new THREE.LineBasicMaterial({color:0xb8a9ff,transparent:true,opacity:0.22});
  return new THREE.LineLoop(geo,mat);
}
PLANETS.forEach(p=>S.add(makeOrbitLine(p.orbitR,0.6)));

// ===== MOON — small companion orbiting close to the hero planet =====
const moonTex=makeRockyTexture(555,[70,70,72],[140,140,145],[195,195,200]);
const moon=new THREE.Mesh(
  new THREE.SphereGeometry(1.6,32,32),
  new THREE.MeshStandardMaterial({map:moonTex.map,bumpMap:moonTex.bump,bumpScale:0.15,roughness:0.95,metalness:0.02})
);
S.add(moon);

// ===== ASTEROID BELT (rocky dust ring, replaces old golden "flowers" ring) =====
const fC=Math.floor(400*PERF),fG=new THREE.BufferGeometry(),fPos=new Float32Array(fC*3);
for(let i=0;i<fC*3;i+=3){const r=5+Math.random()*15,a=Math.random()*Math.PI*2;fPos[i]=Math.cos(a)*r;fPos[i+1]=Math.sin(a)*r*0.6;fPos[i+2]=(Math.random()-0.5)*10-40;}
fG.setAttribute('position',new THREE.BufferAttribute(fPos,3));
const fMat=new THREE.PointsMaterial({size:0.1,map:DOT,color:0x9a8f8a,transparent:true,opacity:0.5,depthWrite:false});
const asteroids=new THREE.Points(fG,fMat);S.add(asteroids);

// ===== NEBULA =====
const nC=Math.floor(3000*PERF),nG=new THREE.BufferGeometry(),nP=new Float32Array(nC*3),nCol=new Float32Array(nC*3);
for(let i=0;i<nC;i++){
  const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=10+Math.random()*25;
  nP[i*3]=r*Math.sin(p)*Math.cos(t);nP[i*3+1]=r*Math.sin(p)*Math.sin(t);nP[i*3+2]=r*Math.cos(p)-5;
  const c=new THREE.Color().setHSL(0.75+Math.random()*0.15,0.6,0.1+Math.random()*0.15);
  nCol[i*3]=c.r;nCol[i*3+1]=c.g;nCol[i*3+2]=c.b;
}
nG.setAttribute('position',new THREE.BufferAttribute(nP,3));nG.setAttribute('color',new THREE.BufferAttribute(nCol,3));
const nMat=new THREE.PointsMaterial({size:0.2,map:DOT,vertexColors:true,transparent:true,opacity:0.12,depthWrite:false,blending:THREE.AdditiveBlending});
const nebula=new THREE.Points(nG,nMat);S.add(nebula);

// ===== GSAP =====
gsap.to('#badge',{opacity:1,duration:1.2,delay:0.3});
gsap.to('#h1',{opacity:1,y:0,duration:1.8,ease:'power4.out',delay:0.6});
gsap.to('#sub',{opacity:1,y:0,duration:1.5,ease:'power3.out',delay:1.0});
gsap.to('#ctaBtn',{opacity:1,duration:1.2,delay:1.4});
gsap.to('#ctaBtn2',{opacity:1,duration:1.2,delay:1.6});
gsap.to('#sHint',{opacity:1,duration:1.5,delay:2.0});

const SP={p:0};
gsap.to(SP,{p:1,ease:'none',scrollTrigger:{trigger:'body',start:'top top',end:'bottom bottom',scrub:1.5}});

// ===== MOUSE =====
const MX={x:0,y:0};
gsap.quickTo(MX,'x',{duration:0.6,ease:'power3.out'});
gsap.quickTo(MX,'y',{duration:0.6,ease:'power3.out'});
window.addEventListener('mousemove',e=>{MX.x=(e.clientX/window.innerWidth)*2-1;MX.y=-(e.clientY/window.innerHeight)*2+1;});

let CLK=new THREE.Clock();
function tick(){
  const t=CLK.getElapsedTime();
  
  // Space rotation
  stars.rotation.y=t*0.005;stars.rotation.x=t*0.002;
  nebula.rotation.y=t*0.003;asteroids.rotation.y=t*0.02;
  
  // Planets — continuous orbital motion around a shared center, plus self-spin
  planetMeshes.forEach(p=>{
    const angle=t*p.speed+p.phase;
    p.obj.position.x=ORBIT_CENTER.x+Math.cos(angle)*p.orbitR;
    p.obj.position.z=ORBIT_CENTER.z+Math.sin(angle)*p.orbitR*0.6;
    p.obj.position.y=ORBIT_CENTER.y+Math.sin(angle*0.6)*p.yAmp;
    p.obj.rotation.y=t*p.spin;
  });
  // Hero planet — huge, drifts slowly close to the camera, always in motion
  heroPlanet.obj.position.x=10*Math.sin(t*0.045);
  heroPlanet.obj.position.y=-4+3.5*Math.sin(t*0.035+1.4);
  heroPlanet.obj.position.z=-10+7*Math.sin(t*0.03);
  heroPlanet.obj.rotation.y=t*heroPlanet.spin;
  moon.position.x=heroPlanet.obj.position.x+Math.cos(t*0.3)*15;
  moon.position.y=heroPlanet.obj.position.y+3+Math.sin(t*0.3)*4;
  moon.position.z=heroPlanet.obj.position.z+Math.sin(t*0.3)*15;
  moon.rotation.y=t*0.05;
  
  // Rockets
  rockets.forEach((r,i)=>{
    r.obj.position.x+=Math.sin(t*r.spd*2+i)*0.03;
    r.obj.position.y+=Math.cos(t*r.spd*1.5+i)*0.03;
    r.obj.position.z+=Math.sin(t*r.spd+i)*0.02;
    r.obj.rotation.y+=r.rot;
    r.obj.rotation.x+=Math.sin(t*0.5+i)*0.01;
  });
  
  // Shooting stars
  const sh=shG.attributes.position.array;
  for(let i=0;i<shC;i++){
    sh[i*3]+=shV[i].x;sh[i*3+1]+=shV[i].y;sh[i*3+2]+=shV[i].z;
    if(sh[i*3]>40||sh[i*3]<-40||sh[i*3+1]>40||sh[i*3+1]<-40){sh[i*3]=(Math.random()-0.5)*80;sh[i*3+1]=(Math.random()-0.5)*80;sh[i*3+2]=(Math.random()-0.5)*80-10;}
  }
  shG.attributes.position.needsUpdate=true;
  
  // Sp = scroll progress + slow autonomous drift — camera gently cruises through space on its own, on top of scroll and mouse parallax
  const sp=SP.p;
  M.position.z=THREE.MathUtils.lerp(40,32,sp)+Math.sin(t*0.015)*9;
  M.position.x=MX.x*2+Math.sin(t*0.011)*4;
  M.position.y=MX.y*2+Math.cos(t*0.009)*2.5;
  M.lookAt(0,0,ORBIT_CENTER.z);
  
  r.render(S,M);requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize',()=>{
  M.aspect=window.innerWidth/window.innerHeight;M.updateProjectionMatrix();
  r.setSize(window.innerWidth,window.innerHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));
  ScrollTrigger.refresh();
});
</script>
</body>
</html>
