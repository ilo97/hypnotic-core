<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic.Studio | Bento Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --cyan: #00ffcc;
            --white: #ffffff;
            --dim: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            padding: 40px;
        }

        .bento-container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
            gap: 20px;
            height: 100%;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), border-color 0.4s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Branding Card */
        .card-brand {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            justify-content: center;
        }

        .logo {
            font-size: 14px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* Hero / Title Card */
        .card-hero {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-hero h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 32px;
            font-weight: 400;
        }

        /* Prompt Card */
        .card-prompt {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            position: relative;
        }

        .card-prompt h2 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--dim);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--white);
            font-size: 24px;
            font-weight: 200;
            resize: none;
            line-height: 1.5;
        }

        .btn-evolve {
            align-self: flex-end;
            background: var(--cyan);
            color: black;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            margin-top: auto;
        }

        /* Gallery Cards */
        .card-gallery-1 { grid-column: 3 / 4; grid-row: 1 / 3; padding: 0; overflow: hidden; }
        .card-gallery-2 { grid-column: 1 / 2; grid-row: 3 / 4; padding: 0; overflow: hidden; }
        .card-gallery-3 { grid-column: 2 / 3; grid-row: 3 / 4; padding: 0; overflow: hidden; }
        
        .img-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            transition: opacity 0.4s ease, scale 0.8s ease;
        }

        .card:hover .img-cover {
            opacity: 1;
            scale: 1.05;
        }

        /* Settings Card */
        .card-settings {
            grid-column: 3 / 4;
            grid-row: 3 / 4;
            justify-content: space-between;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .setting-label { color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }

        @media (max-width: 900px) {
            body { overflow-y: auto; padding: 20px; }
            .bento-container {
                display: flex;
                flex-direction: column;
                height: auto;
            }
            .card { min-height: 200px; }
        }
    </style>
</head>
<body>

    <div class="bento-container">
        <div class="card card-brand">
            <div class="logo">Aesthetic.Studio</div>
        </div>

        <div class="card card-hero">
            <h1>Evolve Reality.</h1>
        </div>

        <div class="card card-gallery-1">
            <img src="../../platform/assets/example1.png" class="img-cover" alt="Example">
        </div>

        <div class="card card-prompt">
            <h2>Initial Prompt</h2>
            <textarea placeholder="Describe the unseen..."></textarea>
            <button class="btn-evolve">Begin Evolution</button>
        </div>

        <div class="card card-gallery-2">
            <img src="../../platform/assets/example2.png" class="img-cover" alt="Example">
        </div>

        <div class="card card-gallery-3">
            <img src="../../platform/assets/example3.png" class="img-cover" alt="Example">
        </div>

        <div class="card card-settings">
            <div class="setting-row">
                <span class="setting-label">Style</span>
                <span>Hyper-Minimal</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">Engine</span>
                <span>Neural Core v2</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">Complexity</span>
                <span>Ultra</span>
            </div>
        </div>
    </div>

    <script>
        gsap.from(".card", {
            opacity: 0,
            y: 30,
            duration: 1,
            stagger: 0.1,
            ease: "power4.out"
        });
    </script>
</body>
</html>
