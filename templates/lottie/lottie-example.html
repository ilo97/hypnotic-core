<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lottie / DotLottie Example</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: #fff;
      background: radial-gradient(circle at 20% 20%, #1a1a24, #08080b 60%);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(920px, 100%);
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; color: rgba(255,255,255,0.7); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; }
    dotlottie-player { width: 100%; height: 280px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    button, select {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
    }
    button:hover { border-color: #00ffcc; color: #00ffcc; cursor: pointer; }
    @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>DotLottie Component Integration</h1>
    <p>CDN: <code>@dotlottie/player-component</code> • Includes icon morph + loading loop examples.</p>

    <div class="row">
      <section class="panel">
        <h3>Main Player</h3>
        <dotlottie-player
          id="main-player"
          src="https://lottie.host/5f2fb634-64bb-405c-bf6e-4d6bb4e5f4a8/iU4P9hYVqX.lottie"
          background="transparent"
          speed="1"
          loop
          autoplay>
        </dotlottie-player>

        <div class="controls">
          <select id="preset">
            <option value="https://lottie.host/5f2fb634-64bb-405c-bf6e-4d6bb4e5f4a8/iU4P9hYVqX.lottie">Icon Morph</option>
            <option value="https://lottie.host/24b48be4-02ff-46d8-8a7f-cf49b511dff0/5KZa4iRrUY.lottie">Loading Loop</option>
            <option value="https://lottie.host/38910fcb-e0de-4316-9f4e-b3b5c86f78e7/BsINqV0fY4.lottie">Pulse Ring</option>
          </select>
          <button id="play">Play</button>
          <button id="pause">Pause</button>
          <button id="toggle-speed">Speed x1.5</button>
        </div>
      </section>

      <section class="panel">
        <h3>Secondary Loader</h3>
        <dotlottie-player
          src="https://lottie.host/24b48be4-02ff-46d8-8a7f-cf49b511dff0/5KZa4iRrUY.lottie"
          background="transparent"
          speed="0.9"
          loop
          autoplay>
        </dotlottie-player>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.js"></script>
  <script>
    const player = document.getElementById('main-player');
    const preset = document.getElementById('preset');
    const speedBtn = document.getElementById('toggle-speed');
    let fast = false;

    preset.addEventListener('change', (e) => {
      player.load(e.target.value);
      player.play();
    });

    document.getElementById('play').addEventListener('click', () => player.play());
    document.getElementById('pause').addEventListener('click', () => player.pause());

    speedBtn.addEventListener('click', () => {
      fast = !fast;
      player.setSpeed(fast ? 1.5 : 1);
      speedBtn.textContent = fast ? 'Speed x1.0' : 'Speed x1.5';
    });
  </script>
</body>
</html>
